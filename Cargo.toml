[package]
name = "tb-chest-collector"
version = "4.3.0"
edition = "2021"
description = "Total Battle Chest Collector: collects clan chests, members, shields and tournament rankings over the game's own network"
license = "GPL-3.0-or-later"
publish = false

[lib]
name = "tbc"
path = "src/lib.rs"

[[bin]]
name = "tbcollector"
path = "src/bin/tbcollector.rs"

[[bin]]
name = "tbcollector-config"
path = "src/bin/tbcollector-config.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = "2"
chrono = "0.4"
regex = "1"
base64 = "0.22"
sha1 = "0.10"
md5 = "0.7"
hex = "0.4"
flate2 = "1"
zstd = "0.13"
lz4_flex = { version = "0.11", default-features = false, features = ["safe-decode"] }
png = "0.18"
ureq = { version = "2.10", features = ["json", "gzip"] }
tungstenite = "0.24"
url = "2"
unicode-normalization = "0.1"
mysql = { version = "25", default-features = false, features = ["minimal-rust", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "wgpu"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
